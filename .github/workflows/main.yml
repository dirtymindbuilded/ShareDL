name: Build ShareDL Release APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    name: Build ARM64 Release APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build ARM64 Release APK
        run: gradle assembleRelease --stacktrace

      - name: Show generated APK files
        run: |
          echo "Searching for APK files..."
          find app/build/outputs -type f -name "*.apk" -print

      - name: Upload Release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ShareDL-arm64-release
          path: app/build/outputs/**/*.apk
          if-no-files-found: error
          retention-days: 30
